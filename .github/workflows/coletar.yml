name: coletar

# A cada 15 minutos. O cron do GitHub e best-effort e atrasa 5 a 15 minutos com
# frequencia — e tudo bem: cada snapshot grava o proprio timestamp, entao o que
# se constroi e uma amostra de exposicao, nao uma grade regular.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Duas execucoes ao mesmo tempo competiriam pelo push. Sem cancelar a que ja
# roda: um snapshot perdido e dado perdido para sempre.
concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: coletar
        run: python src/coletar.py

      - name: commitar o bronze
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nada novo para commitar"
            exit 0
          fi
          git commit -m "bronze: snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --autostash
          git push
